<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#FF7F50">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v=2">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="{{ '/' | relative_url }}" class="logo">
        <span class="logo-icon">🎂</span>
        <span class="logo-text">岁岁念</span>
      </a>
      <nav class="site-nav">
        <a href="{{ '/privacy-policy/' | relative_url }}" {% if page.url contains '/privacy-policy' %}class="active"{% endif %}>隐私政策</a>
        <a href="{{ '/terms/' | relative_url }}" {% if page.url contains '/terms' %}class="active"{% endif %}>用户协议</a>
      </nav>
    </div>
  </header>

  <main class="container content">
    <article class="policy-article">
      <h1 class="policy-title">{{ page.title }}</h1>
      {% if page.last_updated %}
      <p class="meta">最后更新：{{ page.last_updated }}</p>
      {% endif %}

      <div class="markdown-body">
        {{ content }}
      </div>
    </article>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 岁岁念 · 本应用尊重并保护您的隐私</p>
      <p class="footer-sub">
        联系反馈：<a href="mailto:hi@suisuinian.net">hi@suisuinian.net</a>
      </p>
    </div>
  </footer>
</body>
</html>
